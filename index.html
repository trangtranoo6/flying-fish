<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loose Pages — a personal notebook</title>
<meta name="description" content="A personal notebook of experiences, stray thoughts, and imaginary company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- decorative sky: clouds, a kite, and fish drifting behind the page -->
  <div class="sky-scene" aria-hidden="true">
    <svg class="cloud cloud--1" viewBox="0 0 200 90"><g fill="var(--cloud)"><ellipse cx="55" cy="55" rx="55" ry="32"/><ellipse cx="110" cy="40" rx="45" ry="35"/><ellipse cx="150" cy="58" rx="40" ry="26"/></g></svg>
    <svg class="cloud cloud--2" viewBox="0 0 200 90"><g fill="var(--cloud)"><ellipse cx="55" cy="55" rx="55" ry="32"/><ellipse cx="110" cy="40" rx="45" ry="35"/><ellipse cx="150" cy="58" rx="40" ry="26"/></g></svg>
    <svg class="cloud cloud--3" viewBox="0 0 200 90"><g fill="var(--cloud)"><ellipse cx="55" cy="55" rx="55" ry="32"/><ellipse cx="110" cy="40" rx="45" ry="35"/><ellipse cx="150" cy="58" rx="40" ry="26"/></g></svg>
    <svg class="cloud cloud--4" viewBox="0 0 200 90"><g fill="var(--cloud)"><ellipse cx="55" cy="55" rx="55" ry="32"/><ellipse cx="110" cy="40" rx="45" ry="35"/><ellipse cx="150" cy="58" rx="40" ry="26"/></g></svg>

    <svg class="kite-rig" viewBox="0 0 120 260">
      <path d="M60 0 L100 40 L60 90 L20 40 Z" fill="var(--brick)"/>
      <path d="M60 0 L60 90 M20 40 L100 40" stroke="rgba(43,38,32,0.25)" stroke-width="2"/>
      <path d="M60 90 Q64 130 55 160 Q66 185 52 210 Q64 232 58 255" stroke="var(--mustard)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M52 120 l-10 8 10 8 10-8z" fill="var(--sage)"/>
      <path d="M58 165 l-10 8 10 8 10-8z" fill="var(--mustard)"/>
      <path d="M50 210 l-10 8 10 8 10-8z" fill="var(--sage)"/>
    </svg>

    <svg class="fish fish--1" viewBox="0 0 120 50"><g fill="var(--mustard)"><path d="M10 25 Q35 0 90 12 Q75 25 90 38 Q35 50 10 25Z"/><path d="M0 25 L14 16 L14 34 Z"/></g></svg>
    <svg class="fish fish--2" viewBox="0 0 120 50"><g fill="var(--sage)"><path d="M10 25 Q35 0 90 12 Q75 25 90 38 Q35 50 10 25Z"/><path d="M0 25 L14 16 L14 34 Z"/></g></svg>
    <svg class="fish fish--3" viewBox="0 0 120 50"><g fill="var(--brick)"><path d="M10 25 Q35 0 90 12 Q75 25 90 38 Q35 50 10 25Z"/><path d="M0 25 L14 16 L14 34 Z"/></g></svg>
  </div>

  <div class="sheet-wrap">
    <div class="sheet">
      <header class="site-header">
        <a class="brand" href="#/" data-route>
          <span class="brand-mark" aria-hidden="true">✎</span>
          <span class="brand-name">Loose Pages</span>
        </a>
        <nav class="site-nav">
          <a href="#/" data-route data-navkey="">Home</a>
          <a href="#/blog" data-route data-navkey="blog">Blog</a>
          <a href="#/about" data-route data-navkey="about">About</a>
        </nav>
      </header>

      <main id="app" class="app"></main>

      <footer class="site-footer">
        <p>Page is under maintenance. Please revisit later for more!</p>
      </footer>
    </div>
  </div>

  <!-- the margin critter: a small recurring character who reacts in the margins -->
  <div id="critter" class="critter" aria-hidden="true">
    <svg viewBox="0 0 60 60" width="44" height="44">
      <circle cx="30" cy="34" r="20" fill="var(--sage)" opacity="0.9"/>
      <circle cx="23" cy="30" r="2.6" fill="var(--paper)"/>
      <circle cx="37" cy="30" r="2.6" fill="var(--paper)"/>
      <path d="M22 40 Q30 46 38 40" stroke="var(--paper)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M14 22 Q18 10 26 16" stroke="var(--sage)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M46 22 Q42 10 34 16" stroke="var(--sage)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="critter-bubble" id="critterBubble"></div>
  </div>

  <script src="posts.js"></script>
  <script src="script.js"></script>
</body>
</html>
